services:
  - type: web
    name: rcs-robotics-club
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rcs-robotics-db
          property: connectionString

databases:
  - name: rcs-robotics-db
    databaseName: rcs_robotics
    user: rcs_robotics
