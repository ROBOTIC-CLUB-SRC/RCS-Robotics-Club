services:
  - type: web
    name: rcs-robotics-club
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: rcs-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
